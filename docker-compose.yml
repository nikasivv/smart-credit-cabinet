# Запуск: docker compose up --build    →  http://localhost:8080
# С языковой моделью: docker compose --profile ai up --build
name: smart-credit-cabinet

x-backend-env: &backend-env
  APP_ENV: ${APP_ENV:-local}
  DATABASE_URL: postgresql+psycopg://scc:${POSTGRES_PASSWORD:-scc}@db:5432/scc
  JWT_SECRET: ${JWT_SECRET:-change-me-in-production-please-32b}
  INTEGRATIONS_URL: http://mocks:8090
  PIPELINE_MODE: worker
  PIPELINE_STEP_DELAY_SEC: ${PIPELINE_STEP_DELAY_SEC:-1.5}
  AUTO_DECISION_LIMIT: ${AUTO_DECISION_LIMIT:-15000000}
  CORS_ORIGINS: http://localhost:8080
  LLM_URL: ${LLM_URL:-http://ollama:11434}
  LLM_MODEL: ${LLM_MODEL:-qwen2.5:1.5b}

services:
  db:
    image: postgres:16.6-alpine
    environment:
      POSTGRES_DB: scc
      POSTGRES_USER: scc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scc}
    volumes: [db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scc -d scc"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mocks:
    build: ./mocks
    ports: ["${MOCKS_PORT:-8090}:8090"]
    restart: unless-stopped

  migrate:
    build: ./backend
    environment: *backend-env
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
    depends_on:
      db: { condition: service_healthy }
      mocks: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    environment: *backend-env
    ports: ["${API_PORT:-8000}:8000"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped

  worker:
    build: ./backend
    environment: *backend-env
    command: ["python", "-m", "app.worker"]
    # У воркера нет HTTP-сервера: вместо проверки API из образа — свежесть его «пульса»
    healthcheck:
      test: ["CMD", "python", "-m", "app.worker", "--healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    deploy:
      replicas: ${WORKER_REPLICAS:-2}

  web:
    build: ./frontend
    ports: ["${WEB_PORT:-8080}:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

  # ---- Опционально: локальная LLM с открытыми весами (профиль ai) ----
  ollama:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    volumes: [ollama-data:/root/.ollama]
    restart: unless-stopped

  ollama-pull:
    image: ollama/ollama:0.5.4
    profiles: ["ai"]
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "sleep 3 && ollama pull ${LLM_MODEL:-qwen2.5:1.5b}"]
    depends_on: [ollama]
    restart: "no"

  # ---- Тесты: docker compose run --rm tests ----
  tests:
    build:
      context: ./backend
      args: { INSTALL_DEV: "true" }
    profiles: ["test"]
    environment:
      DATABASE_URL: sqlite:////tmp/test.db
      PIPELINE_MODE: inline
      PIPELINE_STEP_DELAY_SEC: "0"
      SEED_DEMO_DATA: "false"
    command: ["pytest"]

volumes:
  db-data:
  ollama-data:
