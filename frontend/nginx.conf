# Файлы интерфейса браузер перепроверяет при каждой загрузке (по ETag ответ обычно 304 — без повторной передачи),
# поэтому после обновления стенда сразу видна новая версия. Ответы API кеширование задают сами.
map $uri $static_cache {
    ~^/api/  "";
    default  "no-cache";
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'" always;
    # Заголовок задаётся на уровне server: add_header внутри location отменил бы все заголовки выше, включая CSP
    add_header Cache-Control $static_cache always;

    location = /healthz { return 200 "ok"; add_header Content-Type text/plain; }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
    location ~ ^/(docs|redoc|openapi.json) {
        add_header Content-Security-Policy "" always;
        proxy_pass http://api:8000;
    }
    location / { try_files $uri /index.html; }
}